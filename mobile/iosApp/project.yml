name: Vanessa
options:
  bundleIdPrefix: com.vanessa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  VanessaShared:
    path: ../shared
targets:
  Vanessa:
    type: application
    platform: iOS
    sources:
      - path: Vanessa
    info:
      path: Vanessa/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Vanessa usa o microfone para capturar gastos por voz.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanessa.app
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Vanessa/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: VanessaShared
        product: VanessaShared
